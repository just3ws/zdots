# Pre-commit configuration for Zdots
# Ensures safety and quality for both human and AI contributions.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-bn"] # 2 spaces, indent cases, binary ops at start

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
        args: ["--shell=bash", "-x"]
        files: \.(sh|bash|bashrc|bash_profile|aliases\.bash|env\.sh)$

      - id: bin-check
        name: bin/check
        entry: ./bin/check
        language: script
        pass_filenames: false
        always_run: true
