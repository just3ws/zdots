# etc/omp/config.home.yml — Hybrid Local + Multi-Account Frontier posture (Home-only).
# Guarded by zdots_cloud_lane_guard (hard-blocked when ZDOTS_CONTEXT=work).
# Routes smol/background housekeeping to Apple on-device Foundation Models ($0, zero quota burn,
# fallback to local llama.cpp at 127.0.0.1:11500/v1), and routes default/plan/slow/task/vision
# across authenticated frontier accounts with automatic 429 fallback.
modelRoles:
  default: github-copilot/claude-sonnet-4.6
  plan: github-copilot/claude-opus-4.8
  slow: openai-codex/gpt-6-astra
  task: github-copilot/gemini-3.8-flash
  smol: apple/on-device
  vision: github-copilot/gemini-3.1-pro-preview

retry:
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol
      - github-copilot/gpt-4.1
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    plan:
      - openai-codex/gpt-6-astra
      - github-copilot/claude-sonnet-4.6
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    slow:
      - openai-codex/gpt-5.6-sol
      - github-copilot/claude-opus-4.8
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    task:
      - github-copilot/claude-haiku-4.5
      - apple/on-device
      - llamacpp/local
    smol:
      - llamacpp/local
      - github-copilot/claude-haiku-4.5
    vision:
      - apple/on-device
      - openrouter/google/gemini-2.5-pro

browser:
  enabled: false
computer:
  enabled: false
