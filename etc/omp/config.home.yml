# etc/omp/config.home.yml — Hybrid Local + Multi-Account Frontier posture (Home-only).
# Guarded by zdots_cloud_lane_guard (hard-blocked when ZDOTS_CONTEXT=work).
# Routes smol/background housekeeping to local llama.cpp (127.0.0.1:11500/v1) for $0/zero quota burn,
# and routes default/plan/slow across authenticated frontier accounts with automatic 429 fallback.
modelRoles:
  default: google-gemini-cli/gemini-2.5-pro
  smol: llamacpp/local
  slow: google-gemini-cli/gemini-2.5-pro
  plan: google-gemini-cli/gemini-2.5-pro
  task: google-gemini-cli/gemini-2.5-flash

retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.2
      - github-copilot/gpt-4.1
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    slow:
      - openai-codex/gpt-5.2
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    plan:
      - openai-codex/gpt-5.2
      - openrouter/google/gemini-2.5-pro
      - llamacpp/local
    smol:
      - google-gemini-cli/gemini-2.5-flash
      - openrouter/google/gemini-2.5-flash
    task:
      - openrouter/google/gemini-2.5-flash
      - llamacpp/local

browser:
  enabled: false
computer:
  enabled: false
