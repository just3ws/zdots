# secret-patterns.yaml — at-rest secret detection for `zdots-secret-scan`.
#
# DISTINCT from etc/phi-patterns.yaml. That registry scrubs PHI + credentials
# OUT of the command/AI stream (redact/suppress, mutating). This registry DETECTS
# secrets committed to the repo (cloud keys, tokens, private keys) and reports
# file:line — detect-only, never mutates. Different domain, different semantics,
# different pipeline — hence a separate registry sharing the same RE2 engine.
#
# RE2 syntax only (Go regexp). No backreferences/lookaround.
patterns:
  - name: aws_access_key
    regex: 'AKIA[0-9A-Z]{16}'
  - name: aws_temp_key
    regex: 'ASIA[0-9A-Z]{16}'
  - name: github_token
    regex: 'gh[pousr]_[A-Za-z0-9_]{20,}'
  - name: github_pat
    regex: 'github_pat_[A-Za-z0-9_]{20,}'
  - name: slack_token
    regex: 'xox[baprs]-[A-Za-z0-9-]{10,}'
  - name: gcp_api_key
    regex: 'AIza[0-9A-Za-z_-]{35}'
  - name: google_oauth
    regex: 'ya29\.[0-9A-Za-z_-]+'
  - name: openai_key
    regex: 'sk-[A-Za-z0-9]{20,}'
  - name: private_key
    regex: '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----'
  - name: inline_secret_assignment
    regex: '[A-Z_]+(KEY|SECRET|PASSWORD|TOKEN)\s*=\s*["'']?[0-9a-fA-F]{32,}["'']?'
