# zdots local services — nginx proxy layer
# HTTP→HTTPS redirect + TLS proxy for AI/infra services.
# Certs: mkcert at /opt/homebrew/etc/nginx/certs/zdots-local.{pem,key}
# Trust CA once: run `mkcert -install` (needs macOS keychain auth)

# ─── llama.local — Qwen3-8B inference ────────────────────────────────────────
upstream llama_backend {
    server 127.0.0.1:11500;
    keepalive 2;
}

server {
    listen 80;
    server_name llama.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llama.local;
    include ssl_params.conf;

    # LLM streaming: completions can run for minutes; never buffer.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_connect_timeout   5s;
    proxy_http_version      1.1;
    client_max_body_size    100m;

    location / {
        proxy_pass         http://llama_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Accel-Buffering no always;
    }
}

# ─── embed.local — Nomic embed-v2 embeddings (port 11501) ───────────────────
upstream embed_backend {
    server 127.0.0.1:11501;
    keepalive 4;
}

server {
    listen 80;
    server_name embed.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name embed.local;
    include ssl_params.conf;

    proxy_buffering       off;
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    client_max_body_size  10m;

    location / {
        proxy_pass         http://embed_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── grafana.local — observability dashboards (port 3000) ────────────────────
upstream grafana_backend {
    server 127.0.0.1:3000;
    keepalive 2;
}

server {
    listen 80;
    server_name grafana.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.local;
    include ssl_params.conf;

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass         http://grafana_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Grafana live features use WebSocket.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
