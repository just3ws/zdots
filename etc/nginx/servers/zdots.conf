# zdots local services — nginx proxy layer
# HTTP→HTTPS redirect + TLS proxy for AI/infra services.
# Certs: mkcert at /opt/homebrew/etc/nginx/certs/zdots-local.{pem,key}
# Trust CA once: run `mkcert -install` (needs macOS keychain auth)
#
# Hostnames use the .localhost TLD (decision-011), not .local: .localhost is
# IANA-reserved (RFC 6761) and every OS/browser resolver hard-wires it to
# loopback — no /etc/hosts entry needed, and no exposure to mDNS/Bonjour name
# collision with a real device on the LAN (.local is the mDNS namespace,
# RFC 6762). Clean cutover, no .local legacy redirect: these are single-user
# loopback-only dev endpoints with no external bookmarks to preserve.

# ─── llama.localhost — Qwen3-8B inference (zsvc llama → 11500) ──────────────
upstream llama_backend {
    server 127.0.0.1:11500;
    keepalive 2;
}

server {
    listen 80;
    server_name llama.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llama.localhost;
    include ssl_params.conf;

    # LLM streaming: completions can run for minutes; never buffer.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_connect_timeout   5s;
    proxy_http_version      1.1;
    client_max_body_size    100m;

    location / {
        proxy_pass         http://llama_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Accel-Buffering no always;
    }
}

# ─── embed.localhost — Nomic embed-v2 embeddings (zsvc embed → 11501) ───────
upstream embed_backend {
    server 127.0.0.1:11501;
    keepalive 4;
}

server {
    listen 80;
    server_name embed.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name embed.localhost;
    include ssl_params.conf;

    proxy_buffering       off;
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    client_max_body_size  10m;

    location / {
        proxy_pass         http://embed_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# grafana.local / lgtm.local removed (Z-134): the LGTM/Grafana stack is retired;
# observability moved to native OpenObserve at o2.localhost (below).

# ─── o2.localhost — OpenObserve native observability UI/API (port 5080) ────
# Replaces the LGTM/grafana dashboards (Z-134). The SPA uses WebSocket for live
# tail, so upgrade headers are required.
upstream openobserve_backend {
    server 127.0.0.1:5080;
    keepalive 2;
}

server {
    listen 80;
    server_name o2.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name o2.localhost;
    include ssl_params.conf;

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;

    location / {
        proxy_pass         http://openobserve_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # OpenObserve live tail uses WebSocket.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ─── zdots.localhost — Observable Control Plane status console (zsvc status → 11600)
# Separate from my.localhost so platform health stays reachable when context-engine
# or Postgres is down. Plain HTTP backend (server-rendered, no WebSocket).
# NOTE: the shared cert (zdots-local.pem) must list zdots.localhost in its SANs —
# regenerate before reload (see nginx-regen-certs / decision-011).
upstream zdots_status_backend {
    server 127.0.0.1:11600;
    keepalive 2;
}

server {
    listen 80;
    server_name zdots.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zdots.localhost;
    include ssl_params.conf;

    proxy_read_timeout    15s;
    proxy_connect_timeout 5s;
    client_max_body_size  1m;

    location / {
        proxy_pass         http://zdots_status_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
