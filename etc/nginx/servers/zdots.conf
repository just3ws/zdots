# zdots local services — nginx proxy layer
# HTTP→HTTPS redirect + TLS proxy for AI/infra services.
# Certs: mkcert at /opt/homebrew/etc/nginx/certs/zdots-local.{pem,key}
# Trust CA once: run `mkcert -install` (needs macOS keychain auth)
#
# Hostnames use the .localhost TLD (decision-011), not .local: .localhost is
# IANA-reserved (RFC 6761) and every OS/browser resolver hard-wires it to
# loopback — no /etc/hosts entry needed, and no exposure to mDNS/Bonjour name
# collision with a real device on the LAN (.local is the mDNS namespace,
# RFC 6762). Clean cutover, no .local legacy redirect: these are single-user
# loopback-only dev endpoints with no external bookmarks to preserve.

# ─── llama.localhost — Qwen3-8B inference (zsvc llama → 11500) ──────────────
upstream llama_backend {
    server 127.0.0.1:11500;
    keepalive 2;
}

server {
    listen 80;
    server_name llama.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llama.localhost;
    include ssl_params.conf;

    # LLM streaming: completions can run for minutes; never buffer.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_connect_timeout   5s;
    proxy_http_version      1.1;
    client_max_body_size    100m;

    location / {
        proxy_pass         http://llama_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Accel-Buffering no always;
    }
}

# ─── embed.localhost — Nomic embed-v2 embeddings (zsvc embed → 11501) ───────
upstream embed_backend {
    server 127.0.0.1:11501;
    keepalive 4;
}

server {
    listen 80;
    server_name embed.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name embed.localhost;
    include ssl_params.conf;

    proxy_buffering       off;
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    client_max_body_size  10m;

    location / {
        proxy_pass         http://embed_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── zdots.localhost — Observable Control Plane status console (zsvc status → 11600)
# Separate from my.localhost so platform health stays reachable when context-engine
# or Postgres is down. Plain HTTP backend (server-rendered, no WebSocket).
# NOTE: the shared cert (zdots-local.pem) must list zdots.localhost and
# lan.just3ws.com in its SANs — regenerate before reload (see
# nginx-regen-certs / decision-011).
upstream zdots_status_backend {
    server 127.0.0.1:11600;
    keepalive 2;
}

server {
    listen 80;
    server_name zdots.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zdots.localhost;
    include ssl_params.conf;

    proxy_read_timeout    15s;
    proxy_connect_timeout 5s;
    client_max_body_size  1m;

    location / {
        proxy_pass         http://zdots_status_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── lan.just3ws.com — trusted-LAN System Atlas ────────────────────────────
# This host serves only the sanitized topology map and its small live status
# snapshot. The same backend also serves private operator material on
# zdots.localhost; keep those routes inaccessible through the LAN hostname.
server {
    listen 80;
    server_name lan.just3ws.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lan.just3ws.com;
    include ssl_params.conf;

    proxy_read_timeout    10s;
    proxy_connect_timeout 3s;
    client_max_body_size  1m;

    location = / {
        return 302 /map;
    }

    location = /map {
        proxy_pass         http://zdots_status_backend/map;
        proxy_set_header   Host zdots.localhost;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /map.json {
        proxy_pass         http://zdots_status_backend/map.json;
        proxy_set_header   Host zdots.localhost;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

