# gemstash.localhost — RubyGems caching proxy + private gem host (zsvc gemstash → 9292)
# TLS front for the loopback-only gemstash Platform Service. Bundler keeps its
# mirror pointed at http://127.0.0.1:9292 directly (Ruby's OpenSSL does not read
# the macOS keychain, so the mkcert CA is invisible to it); this vhost serves
# browser/UI access and any future LAN exposure.
# A 502 here means the service is down (zsvc status gemstash).

upstream gemstash_backend {
    server 127.0.0.1:9292;
    keepalive 4;
}

server {
    listen 80;
    server_name gemstash.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gemstash.localhost;
    include ssl_params.conf;

    proxy_read_timeout    300s;   # first fetch of a large gem streams through rubygems.org
    proxy_connect_timeout 5s;
    client_max_body_size  200m;   # private `gem push` payloads

    location / {
        proxy_pass         http://gemstash_backend;
        proxy_http_version 1.1;            # required companions for `keepalive` in the upstream block
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
