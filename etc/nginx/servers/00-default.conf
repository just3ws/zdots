# 00-default.conf — explicit default_server catch-all (Z-205 AC#3 decision).
#
# Before this file, the default vhost for an unmatched Host header was whatever
# conf sorted first ([redacted].conf) — which is how zdots.localhost returned a
# convincing 200 from the [redacted] app for weeks before its vhost existed (the
# decision-011 "false-green"). An unmatched name must fail LOUDLY, not borrow
# another app's 200.
#
# 443-only: the stock nginx.conf server block already holds default_server on
# :80 (the welcome page nginx-ctl status probes) — a second :80 default would
# fail nginx -t with "duplicate default server". The false-green lived on :443,
# so :443 is where the catch-all matters. 404 (not 444) so probes still get an
# HTTP response; the header makes a fallthrough self-diagnosing:
#   curl -skI https://nonesuch.localhost/ | grep -i x-zdots-default

server {
    listen 443 ssl default_server;
    server_name _;
    include ssl_params.conf;

    add_header X-Zdots-Default "unmatched-host" always;
    return 404;
}
