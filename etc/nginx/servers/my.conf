# my.local / dev.my.local — context-engine (Rails) over Puma unix sockets.
# Deployed by bin/bootstrap alongside zdots.conf. The app binds the sockets
# (/tmp/my_{prod,dev}.sock); a 502 here means the Rails app isn't running.
# Certs: mkcert at /opt/homebrew/etc/nginx/certs/zdots-local.{pem,key}

# ─── my.local — production ───────────────────────────────────────────────────
server {
    listen 80;
    server_name my.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my.local;
    include ssl_params.conf;

    location / {
        proxy_pass http://unix:/tmp/my_prod.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── dev.my.local — development ──────────────────────────────────────────────
server {
    listen 80;
    server_name dev.my.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.my.local;
    include ssl_params.conf;

    location / {
        proxy_pass http://unix:/tmp/my_dev.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
