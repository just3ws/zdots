# my.local — context-engine (Rails) over Puma unix socket (/tmp/my_prod.sock).
# Deployed by bin/bootstrap alongside zdots.conf.
# A 502 here means the Rails app isn't running (zsvc status context-engine).
# Certs: mkcert at /opt/homebrew/etc/nginx/certs/zdots-local.{pem,key}

server {
    listen 80;
    server_name my.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my.local;
    include ssl_params.conf;

    location / {
        proxy_pass http://unix:/tmp/my_prod.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
