# etc/phi-patterns.yaml — PHI Pattern Registry
#
# Single source of truth for all PHI redaction patterns and risk weights.
# Consumed by lib/phi_scrubber.bash (redaction) and lib/ai-query-lib.bash (risk scoring).
#
# Fields:
#   name     — identifier used in tests and audit logs
#   regex    — POSIX ERE passed to sed -E (must be single-line safe)
#   replace  — replacement string (the redaction marker)
#   weight   — integer risk score for aiq_scan; omit for redaction-only patterns
#
# Constraint: regex and replace values must not contain ';' — it is used as
# the sed substitution delimiter to avoid conflicts with patterns containing '/'.
# If a future pattern requires ';', update _phi_load_patterns in lib/phi_scrubber.bash.

patterns:
  - name: ssn
    regex: '[0-9]{3}-[0-9]{2}-[0-9]{4}'
    replace: '[REDACTED-SSN]'
    weight: 90

  - name: mrn
    regex: 'MRN[[:space:]]*:?[[:space:]]*[0-9]+'
    replace: '[REDACTED-MRN]'
    weight: 75

  - name: dob
    regex: '(DOB|[Dd]ate[[:space:]]+[Oo]f[[:space:]]+[Bb]irth)[[:space:]]*:?[[:space:]]*[0-9]{1,2}[/\-][0-9]{1,2}[/\-][0-9]{2,4}'
    replace: '[REDACTED-DOB]'
    weight: 60

  - name: conn_string
    regex: '(postgresql|mysql|redis)://[^@[:space:]]+@[^/[:space:]]*'
    replace: '[REDACTED-CONN]'
    weight: 85
