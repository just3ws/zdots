# etc/ai-models.yaml — llama.cpp model registry
#
# Hardware target: Apple Silicon M4, 16GB unified memory, 256GB primary storage.
# Storage discipline: keep ONE active model per profile. Delete unused GGUFs.
# Override model storage path via ZDOTS_AI_MODELS_DIR in .zdots.env.
#
# Field definitions:
#   model_file   — GGUF filename on disk (under ZDOTS_AI_MODELS_DIR)
#   hf_repo      — HuggingFace repo slug (bartowski quantizations preferred)
#   size_gb      — approximate disk footprint
#   ctx_size     — recommended --ctx-size for llama-server
#   n_gpu_layers — Metal GPU layers (99 = all; M4 can offload full 7B)
#   description  — usage guidance

profiles:
  standard:
    model_file: "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF"
    size_gb: 4.7
    ctx_size: 32768
    n_gpu_layers: 99
    description: "Verified 2026 SOTA coding model. High-speed agentic reasoning."

  reasoning:
    model_file: "DeepSeek-V3-Q4_K_M.gguf"
    hf_repo: "MaziyarPanahi/DeepSeek-V3-GGUF"
    size_gb: 4.8
    ctx_size: 16384
    n_gpu_layers: 99
    description: "DeepSeek V3. Superior logical and algorithmic reasoning."

  constrained:
    model_file: "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF"
    size_gb: 1.1
    ctx_size: 8192
    n_gpu_layers: 99
    description: "Ultra-lightweight Qwen2.5. Perfect for background tasks."

  embed:
    model_file: "nomic-embed-text-v2-moe.Q8_0.gguf"
    hf_repo: "nomic-ai/nomic-embed-text-v2-moe-GGUF"
    size_gb: 0.52
    ctx_size: 512
    n_gpu_layers: 99
    description: "Nomic v2 MoE embedding model. Best-in-class local RAG."

whisper_profiles:
  standard:
    model_file: "ggml-large-v3-turbo.bin"
    hf_repo: "ggerganov/whisper.cpp"
    size_gb: 1.5
    description: "High-accuracy transcription. Optimized for speed/quality balance."

  light:
    model_file: "ggml-small.en.bin"
    hf_repo: "ggerganov/whisper.cpp"
    size_gb: 0.5
    description: "Fast, English-only transcription for background tasks."

default_profile: "standard"
default_whisper_profile: "standard"

# llama-server startup defaults (M4 / 16GB tuning)
server:
  host: "127.0.0.1"
  port: 8080
  # Parallel decode slots. 2 is safe for 16GB; drop to 1 if OOM.
  parallel: 2
  # Logical maximum batch size: upper bound on tokens per scheduling cycle.
  # Must be >= longest single input (embedding chunk, long prompt). 2048
  # covers typical RAG payloads up to ~1500 words.
  batch_size: 2048
  # Physical maximum batch size: tokens dispatched per Metal kernel call.
  # Must be <= batch_size.
  #
  # EMBEDDING CONSTRAINT: for /v1/embeddings requests, the entire input
  # sequence must fit within a single ubatch — llama.cpp cannot chunk an
  # embedding across multiple physical dispatches because mean/cls pooling
  # requires all token vectors to be present simultaneously. If input tokens
  # exceed ubatch_size, llama-server returns HTTP 500:
  #   "input (N tokens) is too large to process. increase the physical batch size"
  #
  # Set to match batch_size so embedding inputs up to 2048 tokens succeed.
  # The llama.cpp default of 512 breaks any embedding request > 512 tokens
  # (roughly > 380 words).
  ubatch_size: 2048
  # KV cache quantization. q8_0 halves cache memory vs the f16 default with
  # negligible quality loss. At ctx_size=32768 x parallel=2 on a 7B model,
  # this saves ~1GB of unified memory.
  cache_type_k: q8_0
  cache_type_v: q8_0
  # Prompt prefix cache reuse. Reuses the KV cache across requests that share
  # a common prefix — every `ai` shell call sends the same system prompt, so
  # this eliminates redundant prefill work after the first call.
  # Value is the minimum matching prefix length in tokens to trigger reuse.
  cache_reuse: 256
  # Cap generation length per request. Prevents a runaway prompt from
  # occupying a slot indefinitely. 2048 is generous for shell assistant use.
  # Set to -1 to remove the cap.
  n_predict: 2048
  # Stable API-facing model name. Integrations use this value in the `model`
  # field of requests. Decouples callers from the GGUF filename so switching
  # profiles (e.g. standard → reasoning) doesn't break anything.
  alias: "local"
  # Enable /v1/embeddings endpoint (OpenAI-compatible). Required by RAG and
  # semantic-search integrations. pooling controls how token vectors are
  # combined: "mean" is the correct default for most embedding models.
  embeddings: true
  pooling: mean
  # Flash Attention: ~2-4x KV cache memory reduction on Apple Silicon.
  # Speeds up longer-context inference; safe to enable on M4.
  flash_attn: true
  # Prometheus metrics at /metrics. Scraped by otelcol for the LGTM stack.
  metrics: true
