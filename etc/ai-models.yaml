# etc/ai-models.yaml — llama.cpp model registry
#
# Hardware targets:
#   home — Apple M4, 16GB unified memory, 256GB storage  → qwen3-8b (default)
#   work — Apple M5 Pro, 24GB unified memory, 1TB storage → qwen3-14b (default)
#
# Storage discipline: keep ONE active model per profile. Delete unused GGUFs.
# Override model storage path via ZDOTS_AI_MODELS_DIR in .zdots.env.
# Override active profile via ZDOTS_AI_PROFILE env var.
#
# Field definitions:
#   model_file   — GGUF filename on disk (under ZDOTS_AI_MODELS_DIR)
#   hf_repo      — HuggingFace repo slug (bartowski quantizations preferred)
#   size_gb      — approximate disk footprint (model only; add ~2.5GB for KV cache)
#   ctx_size     — recommended --ctx-size for llama-server
#   n_gpu_layers — Metal GPU layers (99 = all layers to GPU)
#   parallel     — decode slots; overrides server default when set in profile
#   description  — usage guidance

profiles:
  qwen3-8b:
    model_file: "Qwen_Qwen3-8B-Q4_K_M.gguf"
    hf_repo: "bartowski/Qwen_Qwen3-8B-GGUF"
    # Speculative decoding: enabled on work context (M5 Pro 24GB), disabled on
    # home (M4 16GB — GPU OOM). Gated by ZDOTS_CONTEXT in llama-ctl install.
    # Override with ZDOTS_SPEC_DECODING=1 (force on) or =0 (force off).
    draft_model_file: "Qwen_Qwen3-0.6B-Q4_K_M.gguf"
    draft_hf_repo: "bartowski/Qwen_Qwen3-0.6B-GGUF"
    size_gb: 5.4
    ctx_size: 32768
    n_gpu_layers: 99
    description: "Qwen3-8B. Thinking off by default (--reasoning off); use /think in prompt to enable. n_embd=4096."

  qwen3-14b:
    model_file: "Qwen_Qwen3-14B-Q4_K_M.gguf"
    hf_repo: "bartowski/Qwen_Qwen3-14B-GGUF"
    # Spec decoding: enabled on work context (ZDOTS_CONTEXT=work).
    draft_model_file: "Qwen_Qwen3-0.6B-Q4_K_M.gguf"
    draft_hf_repo: "bartowski/Qwen_Qwen3-0.6B-GGUF"
    size_gb: 8.5
    ctx_size: 32768
    n_gpu_layers: 99
    parallel: 2   # overrides server default (1); M5 Pro 24GB fits 14B + 2x KV cache + draft at ~15.9GB
    description: "Qwen3-14B. Work default (M5 Pro 24GB). Better quality than 8B. Thinking off by default; use /think to enable."

  standard:
    model_file: "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF"
    size_gb: 4.7
    ctx_size: 32768
    n_gpu_layers: 99
    description: "Rollback: Qwen2.5-Coder 7B. n_embd=3584 (requires vector dimension migration to revert)."

  llama-3.1:
    model_file: "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    hf_repo: "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"
    size_gb: 4.9
    ctx_size: 16384
    n_gpu_layers: 99
    description: "Meta Llama 3.1. High-quality instruction following and general knowledge. Gated model."

  constrained:
    model_file: "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF"
    size_gb: 1.1
    ctx_size: 8192
    n_gpu_layers: 99
    description: "Ultra-lightweight Qwen2.5. Perfect for background tasks."

  embed:
    model_file: "nomic-embed-text-v2-moe.Q8_0.gguf"
    hf_repo: "nomic-ai/nomic-embed-text-v2-moe-GGUF"
    size_gb: 0.52
    ctx_size: 512
    n_gpu_layers: 99
    description: "Nomic v2 MoE embedding model. Best-in-class local RAG."

whisper_profiles:
  standard:
    model_file: "ggml-large-v3-turbo.bin"
    hf_repo: "ggerganov/whisper.cpp"
    size_gb: 1.5
    url_prefix: "models/"
    description: "High-accuracy transcription. Optimized for speed/quality balance."

  max-accuracy:
    model_file: "ggml-large-v3.bin"
    hf_repo: "ggerganov/whisper.cpp"
    size_gb: 3.1
    url_prefix: ""
    description: "Absolute highest precision available. Slower than turbo, but superior for complex audio."

  light:
    model_file: "ggml-small.en.bin"
    hf_repo: "ggerganov/whisper.cpp"
    size_gb: 0.5
    url_prefix: "models/"
    description: "Fast, English-only transcription for background tasks."

default_profile: "qwen3-8b"
default_profile_work: "qwen3-14b"
default_whisper_profile: "standard"

# Settings for the dedicated embedding server (com.zdots.llama-embed, port 11501).
# Separate from server: because embeddings + spec-decoding crash llama.cpp.
# Managed by: llama-ctl install-embed / start-embed / stop-embed
embed_server:
  host: "127.0.0.1"
  port: 11501
  parallel: 1
  batch_size: 2048
  # Must match batch_size so any embedding input up to 2048 tokens succeeds.
  ubatch_size: 2048
  cache_type_k: f16
  cache_type_v: f16
  alias: "embed"

# llama-server startup defaults (M4 / 16GB tuning)
server:
  host: "127.0.0.1"
  port: 11500
  # Parallel decode slots. Reduced to 1 to prevent GPU OOM with Qwen3-8B.
  # Each slot holds a full KV cache; 2 slots caused 278 OOM crashes under sequential load.
  parallel: 1
  # Logical maximum batch size: upper bound on tokens per scheduling cycle.
  # Must be >= longest single input (embedding chunk, long prompt). 2048
  # covers typical RAG payloads up to ~1500 words.
  batch_size: 2048
  # Physical maximum batch size: tokens dispatched per Metal kernel call.
  # Must be <= batch_size.
  #
  # EMBEDDING CONSTRAINT: for /v1/embeddings requests, the entire input
  # sequence must fit within a single ubatch — llama.cpp cannot chunk an
  # embedding across multiple physical dispatches because mean/cls pooling
  # requires all token vectors to be present simultaneously. If input tokens
  # exceed ubatch_size, llama-server returns HTTP 500:
  #   "input (N tokens) is too large to process. increase the physical batch size"
  #
  # Set to match batch_size so embedding inputs up to 2048 tokens succeed.
  # The llama.cpp default of 512 breaks any embedding request > 512 tokens
  # (roughly > 380 words).
  ubatch_size: 2048
  # KV cache quantization. q8_0 halves cache memory vs the f16 default with
  # negligible quality loss. At ctx_size=32768 x parallel=2 on a 7B model,
  # this saves ~1GB of unified memory.
  cache_type_k: q8_0
  cache_type_v: q8_0
  # Prompt prefix cache reuse. Reuses the KV cache across requests that share
  # a common prefix — every `ai` shell call sends the same system prompt, so
  # this eliminates redundant prefill work after the first call.
  # Value is the minimum matching prefix length in tokens to trigger reuse.
  cache_reuse: 256  # re-enabled: no draft model conflict
  # Cap generation length per request. -1 = unlimited (generation stops at EOS).
  # 2048 was the previous cap; removed because it silently truncated migration
  # scripts, security audits, and any long explanation mid-generation.
  n_predict: -1
  # Speculative decoding: draft model generates N candidate tokens; main model
  # verifies in one forward pass. Typical speedup: 1.5–2× generation.
  # draft model must be the same family/tokenizer as the main model.
  spec_draft_n_max: 5
  # Stable API-facing model name. Integrations use this value in the `model`
  # field of requests. Decouples callers from the GGUF filename so switching
  # profiles (e.g. standard → reasoning) doesn't break anything.
  alias: "local"
  # Embeddings disabled on the chat server — conflicts with speculative decoding
  # in llama.cpp (crashes completions endpoint). RAG requires a dedicated
  # embedding server on a separate port (see docs/rag-activation.md task).
  embeddings: false
  pooling: mean
  # Flash Attention: ~2-4x KV cache memory reduction on Apple Silicon.
  # Speeds up longer-context inference; safe to enable on M4.
  flash_attn: true
  # Prometheus metrics at /metrics. Scraped by otelcol for the LGTM stack.
  metrics: true
  # Server-level default temperature for requests that don't specify it.
  # aiq_submit (ai-query pipeline) overrides this per-request via AIQ_TEMPERATURE.
  # 0.4 is better than the llama.cpp default (0.8) for a code/shell assistant.
  temperature: 0.4
  # Disable Qwen3 thinking mode globally. Thinking generates extended <think>...</think>
  # chains that consume unbounded GPU memory, causing OOM crashes on multi-turn inference.
  # Pass /think in a user message to re-enable thinking for a specific request.
  no_thinking: true
