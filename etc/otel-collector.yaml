# etc/otel-collector.yaml — Full-context local observability collector
#
# Architecture: Bare-metal collector on host → OpenObserve (native, :5080)
# Receives: OTLP push (apps), host metrics, container stats, log files
# Exports:  Debug log, local file (rotated), OpenObserve (OTLP HTTP)

receivers:
  # Application telemetry (traces, metrics, logs via OTLP gRPC + HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"
        cors:
          allowed_origins:
            - http://127.0.0.1:5173
            - http://127.0.0.1:3003
            - http://localhost:5173
            - http://localhost:3003
            - http://localhost:8080      # app app origin (session-capture browser OTel Web SDK)
          # The session-capture extension wraps window.fetch to inject X-Request-Id on
          # EVERY request (injected.js), incl. the OTLP export — so the browser preflight
          # requests it. Without listing it here CORS drops ACAO and the export is blocked.
          allowed_headers:
            - Content-Type
            - X-Request-Id

  # System metrics: CPU, memory, disk, network, load, processes
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      load:
      network:
      paging:
      # process scraper omitted: macOS sandboxing prevents reading system PIDs
      processes:

  # NOTE (Z-134): the docker_stats receiver was removed when observability went
  # native — Colima is no longer part of the observability plane, so scraping the
  # Colima docker.sock just produced connection errors when the VM is stopped.
  # Re-add it on a box that genuinely runs container workloads worth monitoring.

  # app lograge request log -> OTLP log records (TASK-XXX log spine).
  # app runs in Colima and writes /bear/log/lograge.json; /bear is the repo
  # bind-mount (.:/bear in docker-compose.override.yml), so the file is visible
  # on the host. The host collector tails it directly. (filelog + trace_parser
  # both confirmed present in otelcol-contrib 0.148.0.)
  # Path is generic — not baked to one app. ZDOTS_APP_LOG defaults to the app
  # dev log (set in bin/otel-collector); override it to tail a different app.
  # A missing file is fine — filelog just tails nothing until it appears.
  filelog/app:
    include:
      - "${env:ZDOTS_APP_LOG}"
    start_at: end          # only new requests; avoids replaying old lines on restart
    include_file_path: false
    operators:
      - type: json_parser           # 1. parse each line as JSON into attributes
        parse_from: body
        parse_to: attributes
      - type: trace_parser          # 2. lift hex trace_id/span_id into native OTLP fields
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      - type: remove                # 3. drop the now-redundant hex copies
        field: attributes.trace_id
      - type: remove
        field: attributes.span_id

processors:
  # Standard batching for all signals
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Enrich all telemetry with host metadata
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.name:
          enabled: true
        host.arch:
          enabled: true
        os.type:
          enabled: true
        os.description:
          enabled: true

  # Stamp service.name onto filelog-sourced log records so they group under the
  # same service as app's OTLP traces in O2. app.tenant is carried per-record
  # by the lograge custom_options (kept as a record attribute — its value is
  # dynamic, do not hardcode "local").
  resource/applogs:
    attributes:
      - key: service.name
        value: app
        action: upsert

connectors:
  # Generate RED metrics (rate, errors, duration) from trace spans
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s, 10s]
    dimensions:
      - name: event.type
    # Volume controls (Z-156): the duration_bucket series was ~60% of the O2
    # store at ~2 GB/day. Exemplars attached trace IDs to every histogram point
    # (the dominant multiplier); query traces directly instead. A 60s flush
    # cuts data points ~12x vs 5s — 1-min RED resolution is ample for a dev box.
    exemplars:
      enabled: false
    metrics_flush_interval: 60s

exporters:
  # Debug: Output to console
  debug:
    verbosity: basic
  # Local Storage: Save to XDG-compliant location with rotation
  file:
    path: "${env:HOME}/.local/state/zsh/collector-traces.json"
    rotation:
      max_megabytes: 10
      max_backups: 3
  # Raw per-run diagnostic tap. Full-fidelity, NO phi scrub (see the */diag pipelines).
  # LOCAL diagnostic-exercise-runner only; work-scenario-run slices per-run windows out
  # of this file by byte offset. Generous rotation so a serial run never rotates mid-flight.
  file/diag:
    path: "${env:HOME}/.local/state/zsh/collector-diag.jsonl"
    rotation:
      max_megabytes: 128
      max_backups: 2
  # OpenObserve (native, :5080). OTLP HTTP ingest under /api/<org>; the otlphttp
  # exporter appends /v1/{traces,metrics,logs}. Basic-auth is injected from the
  # Keychain at boot by `otel-collector serve` (env ZDOTS_O2_OTLP_AUTH) so the
  # credential never lands in this file or the launchd plist. Default empty keeps
  # `otel-collector validate` working without the env set.
  otlp_http/openobserve:
    endpoint: "http://127.0.0.1:5080/api/default"
    headers:
      Authorization: "${env:ZDOTS_O2_OTLP_AUTH:-}"
      stream-name: "default"
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    # Traces from apps → spanmetrics connector → OpenObserve
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, file, otlp_http/openobserve, spanmetrics]
    # Metrics from apps + host + containers + spanmetrics
    metrics:
      receivers: [otlp, hostmetrics, spanmetrics]
      processors: [resourcedetection, batch]
      exporters: [debug, otlp_http/openobserve]
    # Logs from apps + log files
    logs:
      receivers: [otlp, filelog/app]
      processors: [resource/applogs, resourcedetection, batch]
      exporters: [debug, otlp_http/openobserve]
    # Raw diagnostic taps — same receivers as the live trio, batch only (no phi), raw → file/diag.
    # The /diag suffix dodges the phi-compiler's name=="traces"/"logs" injection gates. Task 2
    # also exempts these from the otherwise-unconditional redaction/phi. O2 path is untouched.
    traces/diag:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/diag]
    logs/diag:
      receivers: [otlp, filelog/app]
      processors: [batch]
      exporters: [file/diag]
    metrics/diag:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/diag]
