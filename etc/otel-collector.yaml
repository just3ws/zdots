# etc/otel-collector.yaml — Standard configuration for local shell observability

receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Debug: Output to console (Replaces deprecated 'logging')
  debug:
    verbosity: detailed
  # Local Storage: Save to XDG-compliant location with rotation
  file:
    path: "${env:HOME}/.local/state/zsh/collector-traces.json"
    rotation:
      max_megabytes: 10
      max_backups: 3
  # Central Hub: Forward to LGTM stack in Colima (gRPC → container :4317)
  otlp/lgtm:
    endpoint: "127.0.0.1:4417"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file, otlp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
