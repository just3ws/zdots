# etc/otel-collector.yaml — Full-context local observability collector
#
# Architecture: Bare-metal collector on host → LGTM stack in Colima
# Receives: OTLP push (apps), host metrics, container stats, log files
# Exports:  Debug log, local file (rotated), LGTM (gRPC)

receivers:
  # Application telemetry (traces, metrics, logs via OTLP gRPC + HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"
        cors:
          allowed_origins:
            - http://127.0.0.1:5173
            - http://127.0.0.1:3003
            - http://localhost:5173
            - http://localhost:3003

  # System metrics: CPU, memory, disk, network, load, processes
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      load:
      network:
      paging:
      # process scraper omitted: macOS sandboxing prevents reading system PIDs
      processes:

  # Container metrics: per-container CPU, memory, network, block I/O
  docker_stats:
    # Colima on this host is using ~/.colima.
    endpoint: "unix://${env:HOME}/.colima/default/docker.sock"
    collection_interval: 15s
    provide_per_core_cpu_metrics: false

  # Tail log files into Loki
  # Filelog receiver: uncomment and add application log paths as needed.
  # Do NOT include otel-collector.log — creates a feedback loop with debug exporter.
  # filelog:
  #   include:
  #     - "/path/to/app.log"
  #   start_at: end

processors:
  # Standard batching for all signals
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Enrich all telemetry with host metadata
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.name:
          enabled: true
        host.arch:
          enabled: true
        os.type:
          enabled: true
        os.description:
          enabled: true

connectors:
  # Generate RED metrics (rate, errors, duration) from trace spans
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s, 10s]
    dimensions:
      - name: event.type
    exemplars:
      enabled: true
    metrics_flush_interval: 5s

exporters:
  # Debug: Output to console
  debug:
    verbosity: basic
  # Local Storage: Save to XDG-compliant location with rotation
  file:
    path: "${env:HOME}/.local/state/zsh/collector-traces.json"
    rotation:
      max_megabytes: 10
      max_backups: 3
  # Central Hub: Forward to LGTM stack in Colima (HTTP → container :4318)
  # Note: gRPC (4417) is unreliable through Colima port forwarding; OTLP HTTP works.
  # MIGRATING (Z-134): being replaced by otlphttp/openobserve below; both run in
  # parallel during validation, then this exporter is dropped from the pipelines.
  otlphttp/lgtm:
    endpoint: "http://127.0.0.1:4418"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
  # OpenObserve (native, :5080). OTLP HTTP ingest under /api/<org>; the otlphttp
  # exporter appends /v1/{traces,metrics,logs}. Basic-auth is injected from the
  # Keychain at boot by `otel-collector serve` (env ZDOTS_O2_OTLP_AUTH) so the
  # credential never lands in this file or the launchd plist. Default empty keeps
  # `otel-collector validate` working without the env set.
  otlphttp/openobserve:
    endpoint: "http://127.0.0.1:5080/api/default"
    headers:
      Authorization: "${env:ZDOTS_O2_OTLP_AUTH:-}"
      stream-name: "default"
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    # Traces from apps → spanmetrics connector → LGTM
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, file, otlphttp/lgtm, otlphttp/openobserve, spanmetrics]
    # Metrics from apps + host + containers + spanmetrics
    metrics:
      receivers: [otlp, hostmetrics, docker_stats, spanmetrics]
      processors: [resourcedetection, batch]
      exporters: [debug, otlphttp/lgtm, otlphttp/openobserve]
    # Logs from apps + log files
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, otlphttp/lgtm, otlphttp/openobserve]
