# etc/otel-collector.yaml — Standard configuration for local shell observability

receivers:
  otlp:
    protocols:
      http:
        endpoint: "localhost:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Debug: Output to console (Replaces deprecated 'logging')
  debug:
    verbosity: detailed
  # Local Storage: Save to local JSON file
  file:
    path: "./traces-collected.json"
  # Central Hub: Forward to LGTM stack in Colima (gRPC → container :4317)
  otlp/lgtm:
    endpoint: "localhost:4417"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file, otlp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
