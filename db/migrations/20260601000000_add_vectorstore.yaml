apiVersion: zdots.io/v1
kind: Migration
metadata:
  version: "2026-06-01"
  description: "Add vectorstore schema and tables for embeddings"
  author: "Mike"

spec:
  # Database changes
  database:
    - type: sql
      up: |
        CREATE EXTENSION IF NOT EXISTS pgvector;
        CREATE TABLE IF NOT EXISTS embeddings (
          id SERIAL PRIMARY KEY,
          lesson_id INTEGER REFERENCES lessons(id),
          embedding vector(384),
          created_at TIMESTAMP DEFAULT NOW(),
          updated_at TIMESTAMP DEFAULT NOW()
        );
        CREATE INDEX idx_embeddings_lesson ON embeddings(lesson_id);
        CREATE INDEX idx_embeddings_vec ON embeddings USING ivfflat (embedding vector_cosine_ops);
      down: |
        DROP TABLE IF EXISTS embeddings CASCADE;
        DROP EXTENSION IF EXISTS pgvector;

  # Config changes (tracked in schema-version.yaml)
  config:
    changes:
      - key: "knowledge.vectorstore"
        from: null
        to: "pgvector"
      - key: "knowledge.embedding_model"
        from: null
        to: "bge-base"

  # Service dependencies
  requires:
    - service: postgres
      version: "14+"

  # Post-migration steps
  post_migration:
    - name: verify_extension
      command: "psql -U zdots_rw my -c 'SELECT extname FROM pg_extension WHERE extname = \"pgvector\"'"
      description: "Verify pgvector extension was created"
      timeout_seconds: 10

  # Validation checks
  validation:
    checks:
      - query: "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='embeddings'"
        description: "Embeddings table created"
      - query: "SELECT COUNT(*) FROM pg_extension WHERE extname='pgvector'"
        description: "pgvector extension installed"
    timeout_seconds: 30

  # Rollback instructions
  rollback:
    instructions: |
      1. Delete all new embeddings
      2. Drop pgvector extension
      3. Revert config changes in schema-version.yaml

  # Breaking changes (warn user)
  breaking_changes:
    - description: "pgvector required for embedding operations"
      mitigation: "Automatically installed; no action needed"
