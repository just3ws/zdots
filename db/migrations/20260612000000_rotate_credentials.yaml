apiVersion: zdots.io/v1
kind: Migration
metadata:
  version: "2026-06-12"
  description: "Rotate database credentials and enforce SCRAM-SHA-256"
  author: "Mike"

spec:
  # Database changes
  database:
    - type: sql
      description: "Rotate credentials for zdots_rw and zdots_ro roles"
      up: |
        -- Note: Actual password rotation is handled by zdots-ctx rotate-creds
        -- This migration documents the schema changes required for the new auth method
        -- ALTER ROLE zdots_rw WITH PASSWORD '${ZDOTS_RW_PASSWORD}';
        -- ALTER ROLE zdots_ro WITH PASSWORD '${ZDOTS_RO_PASSWORD}';

        -- Verify pg_hba.conf enforces SCRAM-SHA-256
        -- This should be done manually by the operator
      down: |
        -- No rollback needed; password rotation is one-way

  # Config changes
  config:
    changes:
      - key: "database.auth_method"
        from: "md5"
        to: "scram-sha-256"

  # Service dependencies
  requires:
    - service: postgres
      version: "10+"

  # Post-migration steps
  post_migration:
    - name: verify_auth_method
      command: "psql -U zdots_rw my -c \"SELECT rolname FROM pg_roles WHERE rolname IN ('zdots_rw', 'zdots_ro')\""
      description: "Verify roles exist"
      timeout_seconds: 10

  # Validation checks
  validation:
    checks:
      - query: "SELECT COUNT(*) FROM pg_roles WHERE rolname IN ('zdots_rw', 'zdots_ro')"
        description: "Both application roles exist"
        expected: 2
    timeout_seconds: 30

  # Rollback instructions
  rollback:
    instructions: |
      1. Restore old pg_hba.conf
      2. Reload PostgreSQL: SELECT pg_reload_conf()
      3. Update password storage mechanism if needed

  # Breaking changes
  breaking_changes:
    - description: "Plaintext passwords no longer supported; SCRAM-SHA-256 enforced"
      mitigation: "Use zdots-ctx rotate-creds to set new passwords"
