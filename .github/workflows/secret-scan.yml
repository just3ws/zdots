name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/zdots-secret-scan/go.mod

      - name: Build zdots-secret-scan (Linux)
        # The committed binary is macOS arm64; build a native one so the
        # bin/secret-scan shim runs the Go path here instead of bash fallback.
        run: go build -o bin/zdots-secret-scan ./cmd/zdots-secret-scan

      - name: Run Secret Scan
        run: ./bin/secret-scan
