name: Check

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sanity:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Environment Info'
        run: |-
          zsh --version
          which zsh

      - name: 'Run Fast Sanity Checks'
        run: ZDOTS_CHECK_SKIP_EXTERNAL=1 ZDOTS_CHECK_REPORT_STARTUP=1 ./bin/check

  full:
    runs-on: macos-latest
    needs: sanity
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Homebrew Downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install Dependencies (Retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if brew bundle --file Brewfile; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "brew bundle failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run Checks (Retry)
        shell: bash
        run: |
          for attempt in 1 2; do
            if ZDOTS_CHECK_REPORT_STARTUP=1 ./bin/check; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "bin/check failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 5
          done
