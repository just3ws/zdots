name: Check

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sanity:
    runs-on: macos-latest
    env:
      ZDOTDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Install Zsh (Linux/act only)'
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: 'Environment Info'
        run: |-
          zsh --version
          which zsh
          echo "ZDOTS_ENV_PROFILE=${ZDOTS_ENV_PROFILE:-unknown}"

      - name: Install yq (required for phi_scrubber)
        run: brew install yq

      - name: 'Capabilities Health Check'
        run: ZDOTS_ENV_PROFILE=ci-act ./bin/capabilities

      - name: 'Verify Session Identity'
        run: |
          SID=$(
            ZDOTS_ENV_PROFILE=ci-act zsh -i -c 'printf "%s\n" "$ZDOTS_SESSION_ID"' \
              | sed $'s/\x1b\][^\x07]*\x07//g; s/\x1b\\[[0-9;]*[a-zA-Z]//g' \
              | grep -E '^[0-9a-f]{32}$' \
              | tail -1
          )
          test -n "$SID"
          echo "session id: ${SID:0:8}..."

      - name: 'Run Fast Sanity Checks'
        run: ZDOTS_CHECK_SKIP_EXTERNAL=1 ZDOTS_CHECK_REPORT_STARTUP=1 ZDOTS_ENV_PROFILE=ci-act ./bin/check

  ruby:
    runs-on: macos-latest
    env:
      ZDOTDIR: ${{ github.workspace }}
      ZDOTS_AI_MODE: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise + Ruby
        uses: jdx/mise-action@v2

      - name: Install PostgreSQL client (required by pg gem)
        run: brew install libpq

      - name: Install gems
        run: |
          VER=$(cat etc/ruby-version)
          BUNDLE_BUILD__PG="--with-pg-config=/opt/homebrew/opt/libpq/bin/pg_config" \
            ~/.local/share/mise/installs/ruby/"${VER}"/bin/bundle install

      - name: Run RSpec
        run: bin/zdots-ruby -S rspec

  full:
    runs-on: macos-latest
    needs: sanity
    if: github.event_name != 'pull_request'
    env:
      ZDOTDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Homebrew Downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('Brewfile.home') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install Dependencies (Retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if brew bundle --file Brewfile.home; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "brew bundle failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run Checks (Retry)
        shell: bash
        run: |
          for attempt in 1 2; do
            if ZDOTS_CHECK_SKIP_EXTERNAL=1 ZDOTS_CHECK_REPORT_STARTUP=1 ./bin/check; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "bin/check failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 5
          done

      # Public-sanity bats: the hermetic subset listed in tests/ci-allowlist.txt
      # (no live services / DB / Keychain / network). GHA sets CI=true, so any
      # env-dependent test inside these files self-skips via skip_in_ci. The full
      # suite — including live-platform e2e — runs on the LOCAL pipeline step.
      - name: Run Bats (public-sanity hermetic subset)
        shell: bash
        env:
          ZDOTS_SKIP_ENV_TESTS: "1"
        run: |
          mapfile -t files < <(grep -vE '^\s*#|^\s*$' tests/ci-allowlist.txt | sed 's#^#tests/#')
          printf 'running %d allowlisted bats files\n' "${#files[@]}"
          bats "${files[@]}"
