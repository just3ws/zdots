name: Check

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sanity:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      ZDOTDIR: ${{ github.workspace }}
      ZDOTS_ENV_PROFILE: ci-act
      ZDOTS_SAFE_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Environment Info
        run: zsh --version

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in .zshenv .zprofile .zshrc .aliasrc .fzf.zsh conf.d/*.zsh functions/enabled/*; do
            [[ -f "$file" ]] || continue
            zsh -n "$file"
          done
          for file in bin/*; do
            [[ -f "$file" ]] || continue
            case "$(head -n 1 "$file")" in
              '#!/usr/bin/env zsh'|'#!/bin/zsh') zsh -n "$file" ;;
              '#!/usr/bin/env bash'|'#!/bin/bash'|'#!/usr/bin/env sh'|'#!/bin/sh') bash -n "$file" ;;
            esac
          done

      - name: Smoke-test interactive startup
        run: |
          zsh -i -c exit
          zsh -l -i -c exit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/zdots-phi-scrub/go.mod

      - name: Test standalone Go modules
        run: |
          go test ./...
        working-directory: cmd/zdots-phi-scrub

      - name: Test shared RE2 registry
        run: go test ./...
        working-directory: pkg/re2registry
