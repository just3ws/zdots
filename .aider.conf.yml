# .aider.conf.yml — Aider defaults tuned for May 2026 local SOTA (Qwen3-Coder + Nomic v2).
#
# Context budget breakdown (32k total):
#   system prompt      ~1k
#   repo map           ~2k  (map-tokens)
#   chat history       ~6k  (max-chat-history-tokens)
#   file content       ~20k (headroom for files you /add)
#   output             ~2k  (n_predict ceiling from llama.cpp)

model: openai/local
weak-model: openai/local

# Use the local nomic-embed-v2-moe for the repo map
# This model handles larger maps better than v1.5
map-tokens: 2048

# May 2026 SOTA optimization: Use the 'architect' pattern even locally.
# The 7B Qwen3 is smart enough to plan its own edits.
architect: true

# Edit format: 'diff' is still the most efficient, but 'architect' 
# uses a special plan/act cycle for better reliability.
edit-format: architect

# Don't auto-commit — review agentic plans from the architect before committing.
auto-commits: false

# LOAD MANAGEMENT:
# Disable shell command suggestions — prevents aider from running unexpected 
# background processes (like indexing or tests) without your explicit command.
suggest-shell-commands: false

# Disable automatic linting/testing during heavy work — run them manually 
# when you have CPU/GPU headroom.
lint: false
test: false
