# mise.toml — zdots runtime version pin
#
# Consumed by:
#   - jdx/mise-action in CI (auto-installs Ruby for the ruby job)
#   - bin/bootstrap (runs `mise install` after brew bundle)
#   - Developers running `mise install` manually
#
# Apple Silicon: Ruby is compiled from source. On first install, pass build
# options so it uses the jemalloc allocator and Homebrew's openssl@3:
#
#   RUBY_CONFIGURE_OPTS="--with-jemalloc \
#     --with-openssl-dir=$(brew --prefix openssl@3)" \
#     mise install
#
# bin/bootstrap does this automatically. If running mise install by hand
# on an M-series Mac, set RUBY_CONFIGURE_OPTS as shown above.
# The pinned version must match etc/ruby-version — update both together.

[tools]
ruby   = "4.0.9"   # latest stable; auto-bumped by upgrade-mise, matches etc/ruby-version
node   = "26.13.0" # current LTS; keep platform repos aligned
go     = "1.26.3"
python = "3.14.10" # latest patch supported by the current locked MLX/DuckDB wheels

[env]
# mise-managed Go toolchain — takes precedence over Homebrew go
GOPATH = "{{env.HOME}}/go"

[settings]
experimental = true  # required for hooks
